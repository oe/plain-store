name: build library

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Select React version
        run: yarn add --dev react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: yarn test
      - run: yarn build
      - run: yarn test:package
      - run: npm run benchmark:check
